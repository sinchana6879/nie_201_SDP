<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>College Event Registration</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <style>
        body {
            background: #f4f6fb;
            font-family: Arial, sans-serif;
            color: #202a44;
        }

        .hero {
            background: linear-gradient(135deg, #263b80, #526fe5);
            color: white;
            padding: 45px 20px;
            text-align: center;
        }

        .hero h1 {
            font-weight: 700;
            margin-bottom: 12px;
        }

        .main-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 16px;
        }

        .panel {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
            margin-bottom: 25px;
        }

        .panel h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
        }

        .btn-register {
            background: #354fc4;
            color: white;
            border: none;
        }

        .btn-register:hover {
            background: #253b9c;
            color: white;
        }

        .status {
            white-space: pre-wrap;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #68718a;
        }
    </style>
</head>

<body>
    <header class="hero">
        <h1>College Event Registration</h1>
        <p class="mb-0">
            Discover events, register online, and be part of campus life.
        </p>
    </header>

    <div id="root"></div>

    <footer>
        College Event Registration System
    </footer>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="config.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const API = `${BASE_URL}/events`;

        function App() {
            const [studentName, setStudentName] = useState("");
            const [email, setEmail] = useState("");
            const [eventName, setEventName] = useState("Coding Competition");
            const [registrations, setRegistrations] = useState([]);
            const [message, setMessage] = useState("");
            const [loading, setLoading] = useState(false);

            async function loadRegistrations() {
                try {
                    const response = await fetch(API);

                    if (!response.ok) {
                        throw new Error("Could not load registrations.");
                    }

                    const data = await response.json();

                    // Supports an array or an object containing registrations.
                    const rows = Array.isArray(data)
                        ? data
                        : data.registrations;

                    if (!Array.isArray(rows)) {
                        throw new Error(
                            "The API response format needs to be matched to the backend."
                        );
                    }

                    setRegistrations(rows);
                } catch (error) {
                    setMessage(
                        "Unable to load registrations. Check that the backend is running and the API URL is correct."
                    );
                }
            }

            useEffect(() => {
                loadRegistrations();
            }, []);

            async function registerStudent(event) {
                event.preventDefault();
                setMessage("");
                setLoading(true);

                try {
                    const response = await fetch(API, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            studentName,
                            email,
                            eventName
                        })
                    });

                    const result = await response.json().catch(() => ({}));

                    if (!response.ok) {
                        throw new Error(
                            result.detail ||
                            result.message ||
                            "Registration failed."
                        );
                    }

                    setMessage("Registration submitted successfully!");
                    setStudentName("");
                    setEmail("");
                    setEventName("Coding Competition");

                    await loadRegistrations();
                } catch (error) {
                    setMessage(
                        error.message ||
                        "Unable to register. Check the backend connection."
                    );
                } finally {
                    setLoading(false);
                }
            }

            return (
                <main className="main-container">
                    <section className="panel">
                        <h2>Register for an Event</h2>

                        <form onSubmit={registerStudent}>
                            <div className="mb-3">
                                <label className="form-label">
                                    Student Name
                                </label>
                                <input
                                    className="form-control"
                                    type="text"
                                    placeholder="Enter your full name"
                                    value={studentName}
                                    onChange={(e) =>
                                        setStudentName(e.target.value)
                                    }
                                    required
                                />
                            </div>

                            <div className="mb-3">
                                <label className="form-label">
                                    Email Address
                                </label>
                                <input
                                    className="form-control"
                                    type="email"
                                    placeholder="Enter your college email"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    required
                                />
                            </div>

                            <div className="mb-4">
                                <label className="form-label">
                                    Select Event
                                </label>
                                <select
                                    className="form-select"
                                    value={eventName}
                                    onChange={(e) =>
                                        setEventName(e.target.value)
                                    }
                                    required
                                >
                                    <option>Coding Competition</option>
                                    <option>Technical Fest</option>
                                    <option>Cultural Fest</option>
                                    <option>Workshop</option>
                                </select>
                            </div>

                            <button
                                className="btn btn-register w-100"
                                type="submit"
                                disabled={loading}
                            >
                                {loading ? "Registering..." : "Register Now"}
                            </button>
                        </form>

                        {message && (
                            <div className="alert alert-info status mt-3 mb-0">
                                {message}
                            </div>
                        )}
                    </section>

                    <section className="panel">
                        <div className="d-flex justify-content-between align-items-center gap-3 mb-3">
                            <h2 className="mb-0">
                                Event Registrations
                            </h2>
                            <button
                                className="btn btn-outline-primary btn-sm"
                                onClick={loadRegistrations}
                                type="button"
                            >
                                Refresh
                            </button>
                        </div>

                        {registrations.length === 0 ? (
                            <p className="text-muted mb-0">
                                No registrations to display yet.
                            </p>
                        ) : (
                            <div className="table-responsive">
                                <table className="table table-striped table-hover align-middle">
                                    <thead className="table-dark">
                                        <tr>
                                            <th>Student Name</th>
                                            <th>Email</th>
                                            <th>Event</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {registrations.map((item, index) => (
                                            <tr key={item.id ?? index}>
                                                <td>
                                                    {item.studentName ??
                                                     item.student_name ??
                                                     item.name ??
                                                     "-"}
                                                </td>
                                                <td>{item.email ?? "-"}</td>
                                                <td>
                                                    {item.eventName ??
                                                     item.event_name ??
                                                     "-"}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </section>
                </main>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
